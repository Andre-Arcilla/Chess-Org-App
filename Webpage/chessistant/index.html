<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessistant | Premium Chess Club Portal</title>
    <link rel="stylesheet" href="/src/style.css">
    
    <!-- Premium Serif & Sans Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>c
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="rustic-theme">
    <div class="login-container">
        <div class="login-card">
            <header>
                <h1>Chessistant</h1>
                <p class="subtitle">Premium Chess Club Portal</p>
            </header>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Member Email</label>
                    <input type="email" id="email" required placeholder="grandmaster@chess.club" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Security Code</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <button type="submit" id="login-btn">Enter Club</button>
            </form>
            
            <div id="error-message" class="error-msg" hidden></div>
        </div>
    </div>
    
    <script type="module" src="/src/login.js"></script>
</body>
</html>
